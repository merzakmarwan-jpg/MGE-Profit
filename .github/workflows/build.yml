name: Build MGE-Profit APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and extract Android project
        shell: bash
        run: |
          set -e

          ZIP="MGE-Profit-Android-v2-root.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP not found"
            echo "Available ZIP files:"
            find . -maxdepth 2 -type f -name "*.zip" -print
            exit 1
          fi

          rm -rf android-project
          mkdir android-project

          unzip -q "$ZIP" -d android-project

          echo "Android project extracted:"
          find android-project -maxdepth 2 -type f | head -50

      - name: Fix Java and Kotlin JVM target
        shell: bash
        run: |
          set -e
          cd android-project

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          text = p.read_text()

          text = text.replace(
              'sourceCompatibility = JavaVersion.VERSION_1_8',
              'sourceCompatibility = JavaVersion.VERSION_17'
          )

          text = text.replace(
              'targetCompatibility = JavaVersion.VERSION_1_8',
              'targetCompatibility = JavaVersion.VERSION_17'
          )

          text = text.replace(
              'jvmTarget = "1.8"',
              'jvmTarget = "17"'
          )

          p.write_text(text)
          PY

          echo "Final app/build.gradle.kts:"
          cat app/build.gradle.kts

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd android-project
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MGE-Profit-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
