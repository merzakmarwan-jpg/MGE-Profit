name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build MGE-Profit APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check ZIP
        run: |
          echo "Repository files:"
          find . -maxdepth 2 -type f
          test -f MGE-Profit-Android-v1.zip

      - name: Extract Android project
        run: |
          rm -rf android-project
          mkdir android-project
          unzip -q MGE-Profit-Android-v1.zip -d android-project

          echo "Project files:"
          find android-project -maxdepth 4 -type f

      - name: Fix Java and Kotlin JVM target
        run: |
          cat > android-project/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.mge.profit"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.mge.profit"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.activity:activity-ktx:1.10.0")
          }
          EOF

      - name: Build APK
        working-directory: android-project
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MGE-Profit-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
